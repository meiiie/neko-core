<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HoLiLiHu</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    background: #16141a;
    color: #f4efe4;
    font-family: Inter, "Noto Sans", sans-serif;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .rule { position: absolute; left: 0; top: 0; right: 0; height: 10px; background: #eda12c; }
  .kicker {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #f0a94a;
  }
  h1 {
    margin: 28px 0 0;
    font-size: 112px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    font-weight: 600;
  }
  p.lead { margin: 28px 0 0; font-size: 34px; line-height: 1.35; color: #e4dcd0; max-width: 18em; }
  footer {
    display: flex;
    justify-content: space-between;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px;
    color: #c8bfb2;
  }
</style>
</head>
<body>
  <div class="rule"></div>
  <div>
    <p class="kicker">Hai Phong, Vietnam</p>
    <h1>HoLiLiHu</h1>
    <p class="lead">Software startup. We build Neko Core.</p>
  </div>
  <footer>
    <span>holilihu.online</span>
    <span>Founded 11 November 2025</span>
  </footer>
</body>
</html>
