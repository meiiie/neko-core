name = "neko-site"
main = "worker.js"
compatibility_date = "2026-07-27"
workers_dev = true # bootstrap URL, kept so the site is reachable even if the zone changes hands
# The public home. Declared here rather than clicked in the dashboard so the binding is in version
# control: whoever redeploys gets the same hostname without knowing to go and attach it.
routes = [{ pattern = "neko.holilihu.online", custom_domain = true }]

# The landing page is plain static files. The Worker exists only to keep /install.sh and /install.ps1
# behaving EXACTLY as they do today - those two paths are printed in the README, in the installers
# themselves, and in every release note, so they are a contract, not a page.
[assets]
directory = "./public"
binding = "ASSETS"
# Static assets are served BEFORE the Worker by default, so `/` never reached it and the release
# rewrite silently did nothing — only paths with no matching file (/install.sh, /__release) ran. The
# HTML has to pass through the Worker for the version and download sizes to be filled in.
run_worker_first = ["/", "/index.html"]
# A wrong URL used to get Cloudflare's bare page. 404.html is served instead, with the real status code
# so crawlers and link checkers still read it as missing rather than as a page that exists.
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 0.1
