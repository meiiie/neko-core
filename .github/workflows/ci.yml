name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The full verify loop on every OS we ship binaries for - a Linux-only CI can't guarantee the
  # macOS/Windows builds actually work (the owner develops on Windows; CI covers the other two).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact stable runtime used by release.yml. Bun 1.4.0 carries the native Windows IOCP/TTY
          # engine that replaced the 1.3.14 raw-stdin failure path; real PTY probes below remain the gate.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: prepare the Linux sandbox primitive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            original_userns="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            echo "NEKO_CI_APPARMOR_USERNS_ORIGINAL=$original_userns" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bun run typecheck
      - name: anti-slop lint
        run: bun run lint
      - name: full test suite
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            # One full Bun process accumulates SRT/UIA/subprocess state on hosted Windows:
            # consecutive clean-main runs failed in unrelated 5s/15s fixtures while PR/local shards
            # passed. Fresh processes keep the SAME 125-file suite and assertions without cross-file
            # process pressure; every test remains assigned to one shard. Keep this sequential so the live
            # sandbox primitives do not contend.
            1..4 | ForEach-Object {
              Write-Host "=== Windows shard $_/4 ==="
              bun test --shard="$_/4"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            bun test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: require colored soft-wrap selection rendering
        shell: pwsh
        env:
          FORCE_COLOR: "3"
        run: bun test test/fullscreen-sim.test.ts --test-name-pattern "fullscreen prompt drag-select copies every soft-wrapped row in both directions"
      - name: require a live benchmark-oracle sandbox
        if: runner.os != 'Windows'
        shell: bash
        env:
          NEKO_REQUIRE_SANDBOX_TESTS: "1"
        run: bun test test/bench-eval-e2e.test.ts test/frontier-bench.test.ts
      - name: require live Windows ACL and MCP launcher boundaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NEKO_REQUIRE_WINDOWS_ACL_TEST: "1"
          NEKO_REQUIRE_WINDOWS_MCP_LAUNCH_TEST: "1"
        run: bun test test/harbor-eval.test.ts test/mcp-launch-safety.test.ts
      - name: restore the Linux sandbox host policy
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "${NEKO_CI_APPARMOR_USERNS_ORIGINAL:-}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$NEKO_CI_APPARMOR_USERNS_ORIGINAL"
          fi
      - name: policy audit (safe/gated boundary)
        run: node bin/neko-source.cjs policy
      - name: build the single binary (bakes NODE_ENV=production - see package.json)
        run: bun run build
      - name: verify the prebuilt binary ignores cwd autoload files
        shell: pwsh
        run: |
          $name = if ($env:RUNNER_OS -eq 'Windows') { 'neko.exe' } else { 'neko' }
          $env:NEKO_TEST_PREBUILT = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'dist' $name)
          bun test test/bun-autoload-safety.test.ts
